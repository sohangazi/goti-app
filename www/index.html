<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>গতি স্টুডিও</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Serif+Bengali:wght@700&family=Tiro+Bangla&family=Baloo+Da+2:wght@700&display=swap">
<style>
:root{--ink:#15131f;--panel:#1e1b2e;--line:#322d4a;--text:#efeaff;--mute:#9a93b8;--acc:#ff5c8a;--key:#ffc857;--cy:#5ad1ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ink);color:var(--text);font:400 15px/1.45 "Hind Siliguri",system-ui,sans-serif;max-width:560px;margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.xs{display:flex;gap:6px}
header b{font-size:20px;font-weight:700;letter-spacing:.2px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button.p{background:var(--acc);border-color:var(--acc);color:#2a0713;font-weight:700}
.stage{display:flex;justify-content:center;padding:4px 14px}
canvas{height:min(46vh,430px);aspect-ratio:9/16;border-radius:6px;background:#0c0b14;touch-action:none;box-shadow:0 0 0 1px var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}
.bar span{flex:1;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
.tl{padding:0 14px 6px}
.tl input[type=range]{width:100%;accent-color:var(--acc);margin:6px 0 0}
#kfrow{position:relative;height:26px;margin:0 8px;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.kf{position:absolute;top:5px;width:16px;height:16px;margin-left:-8px;background:var(--key);transform:rotate(45deg) scale(.7);border:0;border-radius:3px;padding:0}
.kf.on{box-shadow:0 0 0 3px var(--cy)}
.panel{background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:12px 14px 20px}
#gb.sel,#mk.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.up{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lay{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lay button.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.f{display:grid;grid-template-columns:64px 1fr 46px;align-items:center;gap:8px;margin:4px 0}
.f label{color:var(--mute)}
.f input[type=range]{accent-color:var(--acc);width:100%}
.f output{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.g{display:flex;gap:8px;align-items:center;margin:8px 0}
.g input[type=text],.g select{flex:1;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
.g input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.empty{color:var(--mute);padding:8px 0}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;max-width:92vw}
dialog video{width:min(70vw,300px);display:block;margin:8px auto}
dialog::backdrop{background:#000b}
</style>
</head>
<body>
<header><b>গতি স্টুডিও</b><span class="xs"><button id="gif" class="xp">GIF</button><button id="png" class="xp">PNG ZIP</button><button class="p" id="exp">ভিডিও</button></span></header>
<div class="stage"><canvas id="cv" width="540" height="960"></canvas></div>
<div class="bar"><button id="play" aria-label="চালান">▶</button><span id="tm">০.০ / ৫.০ সে</span><button id="addkf">কিফ্রেম যোগ</button><button id="delkf">মুছুন</button></div>
<div class="tl"><input type="range" id="scrub" min="0" max="500" value="0" aria-label="টাইমলাইন"><div id="kfrow"></div></div>
<section class="panel">
 <div class="row"><button data-add="rect">+ আয়তক্ষেত্র</button><button data-add="circle">+ বৃত্ত</button><button data-add="text">+ লেখা</button><label class="up"><input type="file" id="im" accept="image/*" hidden>+ ছবি</label><label class="up"><input type="file" id="vi" accept="video/*" hidden>+ ভিডিও</label><label class="up"><input type="file" id="au" accept="audio/*" hidden>+ অডিও</label><button data-add="group">+ গ্রুপ</button><button data-add="camera">+ ক্যামেরা</button></div>
 <div class="lay" id="lay"></div>
 <div id="props"></div>
</section>
<dialog id="dlg"><div>এক্সপোর্ট হয়েছে (WebM)। ভিডিওতে চেপে ধরে সেভ করুন।</div><video id="out" controls playsinline></video><button id="sv">সেভ করুন</button> <button id="cls" class="p">বন্ধ করুন</button></dialog>
<script>
const $=s=>document.querySelector(s),W=540,H=960,DUR=5;
const cv=$('#cv'),main=cv.getContext('2d');let ctx=main;
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const EASE={lin:x=>x,eio:x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,eo:x=>1-Math.pow(1-x,3),
bounce:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375},
elastic:x=>x==0?0:x==1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};
const ENAME={lin:'সরল',eio:'নরম শুরু-শেষ',eo:'ধীরে থামা',bounce:'লাফ',elastic:'স্প্রিং'};
const PROPS=[['x','X',0,W,1],['y','Y',0,H,1],['s','মাপ',.1,4,.01],['r','ঘূর্ণন',-360,360,1],['o','স্বচ্ছতা',0,1,.01],['b','ঝাপসা',0,40,.5],['sh','শ্যাডো',0,60,1],['gw','গ্লো',0,60,1],['br','উজ্জ্বলতা',-.9,1,.01],['ct','কনট্রাস্ট',-.9,1,.01],['sa','স্যাচুরেশন',-1,2,.01],['hu','হিউ',-180,180,1]];const DEF={b:0,sh:0,gw:0,br:0,ct:0,sa:0,hu:0};
const FONTS=['Hind Siliguri','Noto Serif Bengali','Tiro Bangla','Baloo Da 2'];let layers=[],sel=null,t=0,playing=false,last=0,exporting=false,rec=null,uid=1;
const COL=['#ff5c8a','#5ad1ff','#ffc857','#8f7bff','#4ee3a0'];
function getP(l,t){const k=l.kf;if(t<=k[0].t)return k[0];if(t>=k[k.length-1].t)return k[k.length-1];
 let i=0;while(k[i+1].t<t)i++;const a=k[i],b=k[i+1],e=EASE[a.e]((t-a.t)/(b.t-a.t)),o={};
 for(const [p] of PROPS)o[p]=a[p]+(b[p]-a[p])*e;return o}
function addLayer(type,c){const l={id:uid++,type,color:c||COL[(uid)%5],text:'গতি',
 kf:[{t:0,x:W/2,y:H/2,s:1,r:0,o:1,...DEF,e:'eio'}]};layers.push(l);sel=l.id;return l}
const cur=()=>layers.find(l=>l.id==sel);
function size(l){if(l.type=='text'){ctx.font='700 110px "'+(l.font||'Hind Siliguri')+'",sans-serif';return[ctx.measureText(l.text||' ').width/2,70]}if(l.type=='image'||l.type=='video')return[l.w/2,l.h/2];return[120,120]}
function draw(){ctx=main;ctx.clearRect(0,0,W,H);ctx.save();{const m=cam();ctx.transform(m.a,m.b,m.c,m.d,m.e,m.f)}for(const l of layers){if(l.gid||l.type=='camera')continue;if(l.type=='group')dg(l);else dl(l)}ctx.restore()}
function dl(l){
 syncM(l);if(l.type=='audio')return;const p=getP(l,t);if(l.type=='video'&&!vis(l))return;ctx.save();{const m=md(l);ctx.transform(m.a,m.b,m.c,m.d,m.e,m.f)}ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);ctx.scale(p.s,p.s);ctx.globalAlpha=p.o;ctx.fillStyle=fillOf(l);ctx.filter=fx(p);const ps=[];if(p.gw>0)ps.push([l.color,p.gw,0]);if(p.sh>0)ps.push(['rgba(0,0,0,.65)',p.sh,p.sh/2]);if(!ps.length)ps.push([0,0,0]);for(const [sc,sb,so] of ps){ctx.shadowColor=sc||'transparent';ctx.shadowBlur=sb;ctx.shadowOffsetX=ctx.shadowOffsetY=so;
  if(l.type=='rect'){ctx.beginPath();ctx.roundRect(-120,-120,240,240,28);ctx.fill()}
  else if(l.type=='image'||l.type=='video'){ctx.drawImage(l.type=='video'?l.vid:l.img,-l.w/2,-l.h/2,l.w,l.h)}else if(l.type=='circle'){ctx.beginPath();ctx.arc(0,0,120,0,7);ctx.fill()}
  else{ctx.font='700 110px "'+(l.font||'Hind Siliguri')+'",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l.text,0,0)}
  }ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=ctx.shadowOffsetY=0;ctx.filter='none';if(l.id==sel&&!exporting){ctx.globalAlpha=1;ctx.strokeStyle='#5ad1ff';ctx.lineWidth=3/p.s;ctx.setLineDash([10/p.s,8/p.s]);const[w,h]=size(l);ctx.strokeRect(-w-6,-h-6,2*w+12,2*h+12)}
  ctx.restore()}
function ui(){const l=cur();
 $('#tm').textContent=bn(t.toFixed(1))+' / '+bn(DUR.toFixed(1))+' সে';$('#scrub').value=Math.round(t*100);
 const row=$('#kfrow');row.innerHTML='';
 if(l)l.kf.forEach(k=>{const b=document.createElement('button');b.className='kf'+(Math.abs(k.t-t)<.04?' on':'');b.style.left=(k.t/DUR*100)+'%';b.title=bn(k.t.toFixed(2))+' সে';b.onclick=()=>{t=k.t;ui();draw()};row.appendChild(b)});
 const L=$('#lay');L.innerHTML='';
 layers.forEach((x,i)=>{const b=document.createElement('button');b.className=x.id==sel?'sel':'';b.textContent=({rect:'আয়তক্ষেত্র',circle:'বৃত্ত',text:'লেখা',image:'ছবি',video:'ভিডিও',audio:'অডিও',group:'গ্রুপ',camera:'ক্যামেরা'})[x.type]+' '+bn(i+1)+(x.gid?' ⤷':'')+(x.mask?' ◐':'');b.onclick=()=>{sel=x.id;ui();draw()};L.appendChild(b)});
 if(l){const d=document.createElement('button');d.textContent='লেয়ার মুছুন';d.onclick=()=>{layers.forEach(z=>{if(z.gid==sel){z.gid=0;z.mask=false}if(z.parent==sel)z.parent=0;});layers=layers.filter(z=>z.id!=sel);sel=layers.length?layers[layers.length-1].id:null;ui();draw()};L.appendChild(d);const c=document.createElement('button');c.textContent='কপি';c.onclick=()=>{const n=JSON.parse(JSON.stringify({...l,img:0}));n.img=l.img;n.id=uid++;n.kf.forEach(k=>{k.x+=30;k.y+=30});layers.push(n);sel=n.id;$('#props').dataset.id='';ui();draw()};L.appendChild(c)}
 const P=$('#props');
 if(!l){P.innerHTML='<div class="empty">উপরের বোতাম দিয়ে প্রথম লেয়ার যোগ করুন।</div>';return}
 if(P.dataset.id!=l.id||!P.firstChild){P.dataset.id=l.id;P.innerHTML='';
  (l.type=='audio'?[]:PROPS).forEach(([k,n,mn,mx,st])=>{const f=document.createElement('div');f.className='f';f.innerHTML=`<label>${n}</label><input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}"><output></output>`;P.appendChild(f)});
  const g=document.createElement('div');g.className='g';g.style.flexWrap='wrap';g.innerHTML=`<input type="color" id="col" aria-label="রং"><button id="gb" type="button">গ্রেডিয়েন্ট</button><input type="color" id="c2" aria-label="দ্বিতীয় রং"><input type="range" id="ga" min="0" max="360" aria-label="কোণ" style="width:70px"><select id="ez" aria-label="গতির ধরন">${Object.entries(ENAME).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`;P.appendChild(g);
  if(l.dur)[['start','শুরু',0,DUR],['trimIn','ট্রিম ইন',0,l.dur],['trimOut','ট্রিম আউট',0,l.dur]].forEach(([k,n,mn,mx])=>{const f=document.createElement('div');f.className='f';f.innerHTML='<label>'+n+'</label><input type="range" min="'+mn+'" max="'+mx+'" step="0.05" value="'+l[k]+'"><output>'+bn((+l[k]).toFixed(2))+'</output>';P.appendChild(f);f.querySelector('input').oninput=e=>{l[k]=+e.target.value;if(k=='trimIn'&&l.trimIn>l.trimOut-.1)l.trimIn=Math.max(0,l.trimOut-.1);if(k=='trimOut'&&l.trimOut<l.trimIn+.1)l.trimOut=Math.min(l.dur,l.trimIn+.1);e.target.value=l[k];f.querySelector('output').textContent=bn((+l[k]).toFixed(2));draw()}});if(l.type!='group'&&l.type!='camera'){const gr=document.createElement('div'),gl=layers.filter(z=>z.type=='group');gr.className='g';gr.innerHTML='<select id="gs" aria-label="গ্রুপ"><option value="">গ্রুপ নেই</option>'+gl.map((z,i)=>'<option value="'+z.id+'">গ্রুপ '+bn(i+1)+'</option>').join('')+'</select><button id="mk" type="button">মাস্ক</button><select id="ps" aria-label="প্যারেন্ট"></select>';P.appendChild(gr);$('#ps').onchange=e=>{const v=+e.target.value||0;l.parent=v;if(v){const q=getP(byId(v),t);l.po={x:q.x,y:q.y,s:q.s,r:q.r}}ui();draw()};$('#gs').onchange=e=>{l.gid=e.target.value?+e.target.value:0;if(!l.gid)l.mask=false;ui();draw()};$('#mk').onclick=()=>{if(!l.gid){alert('আগে গ্রুপ বেছে নিন।');return}l.mask=!l.mask;ui();draw()}}
const tx=document.createElement('div');tx.className='g';tx.id='txg';tx.style.flexWrap='wrap';tx.innerHTML='<input type="text" id="txt" aria-label="লেখা" style="flex:1 1 100%"><select id="fn" aria-label="ফন্ট">'+FONTS.map(f=>'<option value="'+f+'">'+f.replace(/^U\d+-/,'')+'</option>').join('')+'</select><label class="up">+ ফন্ট আপলোড<input type="file" id="ff" accept=".ttf,.otf,.woff,.woff2" hidden></label>';P.appendChild(tx);
  P.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>setProp(i.dataset.k,+i.value));
  $('#col').oninput=e=>{l.color=e.target.value;draw()};$('#gb').onclick=()=>{l.g=!l.g;$('#gb').classList.toggle('sel',!!l.g);draw()};$('#c2').oninput=e=>{l.c2=e.target.value;draw()};$('#ga').oninput=e=>{l.ga=+e.target.value;draw()};
  $('#ez').onchange=e=>{const k=[...l.kf].reverse().find(z=>z.t<=t+.04)||l.kf[0];k.e=e.target.value};
  $('#txt').oninput=e=>{l.text=e.target.value;draw()};$('#fn').onchange=e=>{l.font=e.target.value;draw();document.fonts.load('700 110px "'+l.font+'"').then(draw)};$('#ff').onchange=e=>{const f=e.target.files[0];if(!f)return;f.arrayBuffer().then(b=>{const nm='U'+FONTS.length+'-'+f.name.replace(/\.\w+$/,'').replace(/[^\w]/g,'');const F=new FontFace(nm,b);return F.load().then(()=>{document.fonts.add(F);FONTS.push(nm);l.font=nm;$('#props').dataset.id='';ui();draw()})}).catch(()=>alert('ফন্ট লোড হয়নি। .ttf, .otf বা .woff ফাইল দিন।'));e.target.value=''}}
 const p=getP(l,t);P.querySelectorAll('[data-k]').forEach(i=>{const v=p[i.dataset.k];if(document.activeElement!==i)i.value=v;i.nextElementSibling.textContent=bn(+(+v).toFixed(2))});
 $('#col').value=l.color;if($('#gs')){$('#gs').value=l.gid||'';$('#mk').classList.toggle('sel',!!l.mask);const ps=$('#ps');ps.innerHTML='<option value="">প্যারেন্ট নেই</option>'+layers.filter(z=>z.id!=l.id&&z.type!='audio'&&z.type!='camera'&&!isDesc(z,l)).map(z=>'<option value="'+z.id+'">'+nm(z)+'</option>').join('');ps.value=l.parent||''}$('#c2').value=l.c2||'#ffffff';$('#ga').value=l.ga||0;$('#gb').classList.toggle('sel',!!l.g);$('#txg').style.display=l.type=='text'?'flex':'none';$('#txt').value=l.text;$('#fn').value=l.font||'Hind Siliguri';
 $('#ez').value=([...l.kf].reverse().find(z=>z.t<=t+.04)||l.kf[0]).e}
function ensureKf(l){let k=l.kf.find(z=>Math.abs(z.t-t)<.04);
 if(!k){const p=getP(l,t),prev=[...l.kf].reverse().find(z=>z.t<t)||l.kf[0];k={t:+t.toFixed(2),...p,e:prev.e};l.kf.push(k);l.kf.sort((a,b)=>a.t-b.t)}return k}
function setProp(k,v){const l=cur();if(!l)return;const had=l.kf.length;ensureKf(l)[k]=v;draw();if(l.kf.length!=had)ui();else{const o=document.querySelector(`[data-k="${k}"]`);if(o)o.nextElementSibling.textContent=bn(+(+v).toFixed(2))}}
// transport
function tick(n){if(!playing)return;t+=(n-last)/1000;last=n;
 if(t>=DUR){t=DUR;stop();if(exporting){setTimeout(()=>rec.stop(),150)}}
 draw();ui();if(playing)requestAnimationFrame(tick)}
function play(){if(t>=DUR-.01)t=0;playing=true;$('#play').textContent='❚❚';last=performance.now();requestAnimationFrame(tick)}
function stop(){playing=false;layers.forEach(l=>{const m=l.vid||l.aud;if(m)m.pause()});$('#play').textContent='▶'}
$('#play').onclick=()=>playing?stop():play();
$('#scrub').oninput=e=>{stop();t=e.target.value/100;draw();ui()};
$('#addkf').onclick=()=>{const l=cur();if(l){ensureKf(l);ui()}};
$('#delkf').onclick=()=>{const l=cur();if(!l)return;const i=l.kf.findIndex(z=>Math.abs(z.t-t)<.04);if(i>0){l.kf.splice(i,1);draw();ui()}};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(b.dataset.add=='camera'&&layers.some(z=>z.type=='camera'))sel=layers.find(z=>z.type=='camera').id;else addLayer(b.dataset.add);$('#props').dataset.id='';ui();draw()});
// drag on stage
let drag=null;
function pt(e){const r=cv.getBoundingClientRect(),q=cam().inverse().transformPoint(new DOMPoint((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height));return[q.x,q.y]}
cv.onpointerdown=e=>{const[px,py]=pt(e);
 for(const l of [...layers].reverse()){if(l.type=='audio'||l.type=='group'||l.type=='camera')continue;const p=getP(l,t),q=md(l).translate(p.x,p.y).rotate(p.r).scale(p.s).inverse().transformPoint(new DOMPoint(px,py)),rx=q.x,ry=q.y,[w,h]=size(l);
  if(Math.abs(rx)<=w&&Math.abs(ry)<=h){sel=l.id;stop();const pp=md(l).inverse().transformPoint(new DOMPoint(px,py));drag={ox:p.x-pp.x,oy:p.y-pp.y};cv.setPointerCapture(e.pointerId);ui();draw();return}}}
cv.onpointermove=e=>{if(!drag)return;const[px,py]=pt(e);const l=cur(),k=ensureKf(l),pp=md(l).inverse().transformPoint(new DOMPoint(px,py));k.x=Math.round(pp.x+drag.ox);k.y=Math.round(pp.y+drag.oy);draw();ui()};
cv.onpointerup=()=>drag=null;
// export
$('#exp').onclick=()=>{if(!window.MediaRecorder){alert('এই ব্রাউজারে ভিডিও এক্সপোর্ট সাপোর্ট নেই।');return}
 stop();const ch=[],mt=['video/webm;codecs=vp9','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
 const ss=cv.captureStream(30);try{if(!ac){ac=new AudioContext();adest=ac.createMediaStreamDestination()}layers.forEach(l=>{const m=l.vid||l.aud;if(m&&!m._s){m._s=ac.createMediaElementSource(m);m._s.connect(adest);m._s.connect(ac.destination)}});adest.stream.getAudioTracks().forEach(a=>ss.addTrack(a))}catch(_){}
